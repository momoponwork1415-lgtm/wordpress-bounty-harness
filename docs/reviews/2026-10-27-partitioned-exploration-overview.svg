<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L12,6 L0,12 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1500" height="860" fill="#ffffff"/>
  <text x="750" y="44" text-anchor="middle" font-size="28" font-weight="bold" fill="#222">全体像: 外側の Harness と内側の Harness</text>
  <text x="750" y="72" text-anchor="middle" font-size="16" fill="#666">外側は「探索を止めずに回し続ける」仕組み。内側は「プラグイン 1 本の中で AI を動かす」仕組み。AI は内側の中にだけいる。</text>

  <rect x="30" y="100" width="1440" height="730" rx="16" fill="#f3f6fa" stroke="#7f9bb8" stroke-width="2"/>
  <text x="50" y="132" font-size="20" font-weight="bold" fill="#2b4a6b">外側の Harness　24 時間の輪（いまあるもの。変えない）</text>

  <g stroke="#2b4a6b" stroke-width="2" fill="#ffffff">
    <rect x="60" y="160" width="230" height="90" rx="10"/>
    <rect x="340" y="160" width="230" height="90" rx="10"/>
    <rect x="620" y="160" width="230" height="90" rx="10"/>
    <rect x="900" y="160" width="230" height="90" rx="10"/>
    <rect x="1180" y="160" width="260" height="90" rx="10"/>
  </g>
  <g font-size="16" fill="#333" text-anchor="middle">
    <text x="175" y="192" font-weight="bold">対象を選ぶ</text>
    <text x="175" y="218" font-size="13" fill="#666">人気順の帯、履歴、除外</text>
    <text x="455" y="192" font-weight="bold">固定する</text>
    <text x="455" y="218" font-size="13" fill="#666">版と digest、本体と依存も</text>
    <text x="735" y="192" font-weight="bold">調べる</text>
    <text x="735" y="218" font-size="13" fill="#666">↓ 内側の Harness へ</text>
    <text x="1015" y="192" font-weight="bold">ふるい分けて確かめる</text>
    <text x="1015" y="218" font-size="13" fill="#666">段 1b → Lab → 人間が見る</text>
    <text x="1310" y="192" font-weight="bold">台帳に残す</text>
    <text x="1310" y="218" font-size="13" fill="#666">追記専用。次の選定が履歴を読む</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="290" y1="205" x2="338" y2="205"/>
    <line x1="570" y1="205" x2="618" y2="205"/>
    <line x1="850" y1="205" x2="898" y2="205"/>
    <line x1="1130" y1="205" x2="1178" y2="205"/>
    <path d="M1310,250 L1310,280 L175,280 L175,252"/>
  </g>
  <text x="740" y="298" text-anchor="middle" font-size="13" fill="#666">空になったら新しい batch、止まったら backoff して再開、Lab と探索は並走</text>

  <rect x="60" y="330" width="1380" height="470" rx="14" fill="#ffffff" stroke="#4a2b6b" stroke-width="2"/>
  <text x="80" y="362" font-size="20" font-weight="bold" fill="#4a2b6b">内側の Harness　プラグイン 1 本の中で AI を動かす（今回つくるもの）</text>
  <text x="80" y="386" font-size="14" fill="#666">Harness が役ごとに AI を起こし、受け渡しと記録をする。Root はいない。各役は入力 1 つ・出力 1 つ。</text>

  <g stroke="#2b4a6b" stroke-width="2" fill="#eef3f8">
    <rect x="90" y="410" width="250" height="110" rx="10"/>
    <rect x="90" y="560" width="250" height="110" rx="10"/>
    <rect x="90" y="700" width="250" height="80" rx="10"/>
  </g>
  <g font-size="15" fill="#2b4a6b">
    <text x="105" y="436" font-weight="bold">Harness がすること（前）</text>
    <text x="105" y="462">・列挙の script を道具として置く</text>
    <text x="105" y="486">・案の形を検査、超えれば差し戻す</text>
    <text x="105" y="510">・体数と制限時間を決めて起こす</text>
    <text x="105" y="586" font-weight="bold">Harness がすること（後）</text>
    <text x="105" y="612">・出力の形をそろえ、範囲外は脇に</text>
    <text x="105" y="636">・同じ経路を 1 つにまとめる</text>
    <text x="105" y="660">・Lead を全件そろえて渡す</text>
    <text x="105" y="726" font-weight="bold">記録</text>
    <text x="105" y="752">・役ごとの入力と出力の digest</text>
    <text x="105" y="774">・読んだ file 数、時間、token</text>
  </g>

  <g stroke="#4a2b6b" stroke-width="2" fill="#f6f1fa">
    <rect x="400" y="420" width="220" height="130" rx="10"/>
    <rect x="690" y="432" width="220" height="130" rx="10"/>
    <rect x="684" y="426" width="220" height="130" rx="10"/>
    <rect x="678" y="420" width="220" height="130" rx="10"/>
    <rect x="960" y="420" width="220" height="130" rx="10"/>
    <rect x="1242" y="432" width="180" height="130" rx="10"/>
    <rect x="1236" y="426" width="180" height="130" rx="10"/>
    <rect x="1230" y="420" width="180" height="130" rx="10"/>
  </g>
  <g font-size="15" fill="#333">
    <text x="510" y="448" text-anchor="middle" font-weight="bold">列挙役　1 体</text>
    <text x="415" y="476">入口と出口を洗い出す</text>
    <text x="415" y="500">script は自分で走らせて点検</text>
    <text x="415" y="524">区画の切り方を提案</text>
    <text x="788" y="448" text-anchor="middle" font-weight="bold">追跡役　区画ごと 1 体</text>
    <text x="693" y="476">自分の区画だけ読む</text>
    <text x="693" y="500">つながれば Finding</text>
    <text x="693" y="524">途中で止まれば Lead</text>
    <text x="1070" y="448" text-anchor="middle" font-weight="bold">組合せ役　1 体</text>
    <text x="975" y="476">Lead の一覧を読み組を選ぶ</text>
    <text x="975" y="500">1 本につながれば Finding</text>
    <text x="975" y="524">組んだ Lead と理由を書く</text>
    <text x="1320" y="448" text-anchor="middle" font-weight="bold">検証役</text>
    <text x="1320" y="470" text-anchor="middle" font-size="13" fill="#666">Finding ごと 1 体</text>
    <text x="1245" y="500">Lab で前提を作る</text>
    <text x="1245" y="524">経路を再現し記録</text>
  </g>
  <g stroke="#555" stroke-width="2" fill="none" marker-end="url(#ar)">
    <line x1="340" y1="465" x2="398" y2="485"/>
    <line x1="620" y1="485" x2="676" y2="485"/>
    <line x1="898" y1="485" x2="958" y2="485"/>
    <line x1="1180" y1="485" x2="1228" y2="485"/>
  </g>
  <g font-size="12" fill="#2b4a6b" text-anchor="middle">
    <text x="648" y="470">区画の一覧</text>
    <text x="928" y="470">Lead の一覧</text>
    <text x="1204" y="470">Finding 1 件</text>
  </g>

  <rect x="400" y="600" width="1020" height="180" rx="10" fill="#fff4d6" stroke="#c9a227"/>
  <g font-size="14" fill="#444">
    <text x="420" y="628" font-weight="bold" fill="#6b5200">線の引き方: 中身は AI、形は Harness</text>
    <text x="420" y="656">Harness は決定論の処理だけ（出力構造の強制、digest、まとめ、上限、割り当て、Lab、記録）。中身を先に作らず、自由文を分類しない。</text>
    <text x="420" y="682">AI は中身の全部（洗い出し、区画の案、読む順番、どの Lead を組むか、つながるかの判断、Lab での前提作り）。script は AI の道具。</text>
    <text x="420" y="716" font-weight="bold" fill="#6b5200">AI の判断には必ず機械的な記録を添え、分担は観測から決める</text>
    <text x="420" y="744">script の行と AI の行、提案した区画と差し戻し、読ませた Lead と組んだ Lead、Lab のやり取り。run によらず同じ出力になる処理は Harness へ。</text>
    <text x="420" y="768">役の文章（Markdown）と渡した区画（JSON）は別の digest で残し、文章の影響と区画の影響を切り分ける。</text>
  </g>
</svg>
