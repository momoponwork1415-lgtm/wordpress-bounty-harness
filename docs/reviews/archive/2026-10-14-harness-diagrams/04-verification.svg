<svg xmlns="http://www.w3.org/2000/svg" width="480" height="3062" viewBox="0 0 480 3062" role="img" aria-labelledby="title desc"><title id="title">検証・証拠・レビュー</title><desc id="desc">探索入力制限、gVisor、broker、Finding受理、独立Verifier、Harnessのnonce判定、incomplete、review queueの現行差分と人間レビューを説明。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8192a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>.headTitle{font:700 29px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#fff}.headSub{font:500 16px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#d9e7fa}.pageNo{font:700 15px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#a8c2df}.cardTitle{font:700 20px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#102337}.body{font:500 16px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#24384d}.badge{font:700 14px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:white}.num{font:700 22px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#93a4b7}.legend{font:600 13px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#2b3f55}.foot{font:500 12px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#576a7f}</style><rect width="480" height="3062" fill="#f7f9fc"/><rect width="480" height="128" fill="#14283f"/><text x="25" y="49" class="pageNo">HARNESS ARCHITECTURE  4 / 5</text><text x="25" y="88" class="headTitle">検証・証拠・レビュー</text><text x="25" y="115" class="headSub">AIの主張とHarnessの判定を分離</text><rect x="24" y="145" width="432" height="79" rx="15" fill="#fff" stroke="#d9e2ec"/><text x="40" y="169" class="legend">状態の凡例（色と線種で区別）</text><line x1="40" y1="184" x2="64" y2="184" stroke="#0f766e" stroke-width="3"/><text x="72" y="189" class="legend">main</text><line x1="178" y1="184" x2="202" y2="184" stroke="#4f46e5" stroke-width="3" stroke-dasharray="5 3"/><text x="210" y="189" class="legend">Draft</text><line x1="316" y1="184" x2="340" y2="184" stroke="#b45309" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="189" class="legend">提案</text><line x1="40" y1="207" x2="64" y2="207" stroke="#be123c" stroke-width="3"/><text x="72" y="212" class="legend">課題</text><line x1="178" y1="207" x2="202" y2="207" stroke="#7c3aed" stroke-width="3"/><text x="210" y="212" class="legend">人間</text><line x1="316" y1="207" x2="340" y2="207" stroke="#64748b" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="212" class="legend">将来</text><g id="step-1"><rect x="24" y="245" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="245" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="261" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="280" text-anchor="middle" class="badge">main</text><text x="421" y="284" text-anchor="end" class="num">01</text><text x="44" y="317" class="cardTitle">探索agentへ渡す入力</text><text x="44" y="348" class="body">固定source・人間のtrust境界宣言</text><text x="44" y="375" class="body">Programme Boundary・Lab</text><text x="44" y="402" class="body">時点付き公開履歴はカタログのみ</text><text x="44" y="429" class="body">held-outの答え／PoCは渡さない</text></g><line x1="240" y1="454" x2="240" y2="479" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-2"><rect x="24" y="488" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="488" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="504" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="523" text-anchor="middle" class="badge">main</text><text x="421" y="527" text-anchor="end" class="num">02</text><text x="44" y="560" class="cardTitle">隔離と通信</text><text x="44" y="591" class="body">対象実行は使い捨てgVisor内だけ</text><text x="44" y="618" class="body">外向きは認証broker経由のAPI</text><text x="44" y="645" class="body">host source実行へfallbackしない</text><text x="44" y="672" class="body">探索と検証の作業領域を分ける</text></g><line x1="240" y1="697" x2="240" y2="722" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-3"><rect x="24" y="731" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="731" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="747" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="766" text-anchor="middle" class="badge">main</text><text x="421" y="770" text-anchor="end" class="num">03</text><text x="44" y="803" class="cardTitle">候補の受理境界</text><text x="44" y="834" class="body">Finding／Leadを正規化して保存</text><text x="44" y="861" class="body">受理不能はcandidate-held</text><text x="44" y="888" class="body">other等のscope外impactはpark</text><text x="44" y="915" class="body">content-deletionは一律parkしない</text></g><line x1="240" y1="940" x2="240" y2="965" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-4"><rect x="24" y="974" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="974" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="990" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="1009" text-anchor="middle" class="badge">main</text><text x="421" y="1013" text-anchor="end" class="num">04</text><text x="44" y="1046" class="cardTitle">独立Verifierと観測器</text><text x="44" y="1077" class="body">Findingと同じSnapshotで新Lab</text><text x="44" y="1104" class="body">探索会話や管理者sessionは渡さない</text><text x="44" y="1131" class="body">被害者操作はHarnessの型付き手順</text><text x="44" y="1158" class="body">HTTP捕捉とLab前後差分を保存</text></g><line x1="240" y1="1183" x2="240" y2="1208" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-5"><rect x="24" y="1217" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="1217" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="1233" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="1252" text-anchor="middle" class="badge">main</text><text x="421" y="1256" text-anchor="end" class="num">05</text><text x="44" y="1289" class="cardTitle">判定器だけがconfirmedを出す</text><text x="44" y="1320" class="body">nonce付きcanaryの回収を要求</text><text x="44" y="1347" class="body">agent自己申告は証明にしない</text><text x="44" y="1374" class="body">digest不一致はincomplete</text><text x="44" y="1401" class="body">証拠本文はPrivate Evidenceへ</text></g><line x1="240" y1="1426" x2="240" y2="1451" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-6"><rect x="24" y="1460" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="1460" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="1476" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="1495" text-anchor="middle" class="badge">main</text><text x="421" y="1499" text-anchor="end" class="num">06</text><text x="44" y="1532" class="cardTitle">検証の3つの結果</text><text x="44" y="1563" class="body">runtime-confirmed：canary証拠あり</text><text x="44" y="1590" class="body">contradicted：同経路が反証された</text><text x="44" y="1617" class="body">incomplete：環境・前提・観測不足</text><text x="44" y="1644" class="body">incompleteは脆弱性なしを意味しない</text></g><line x1="240" y1="1669" x2="240" y2="1694" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-7"><rect x="24" y="1703" width="432" height="204" rx="18" fill="#fff0f2" stroke="#be123c" stroke-width="2"/><rect x="24" y="1703" width="8" height="204" rx="4" fill="#be123c"/><rect x="43" y="1719" width="78" height="27" rx="13" fill="#be123c"/><text x="82" y="1738" text-anchor="middle" class="badge">課題</text><text x="421" y="1742" text-anchor="end" class="num">07</text><text x="44" y="1775" class="cardTitle">実測：検証で止まる</text><text x="44" y="1806" class="body">完了本番3周：15対象／Finding14</text><text x="44" y="1833" class="body">14件全てincomplete、confirmed 0</text><text x="44" y="1860" class="body">後続3 Trial：Finding9も全件incomplete</text><text x="44" y="1887" class="body">前提不足7、観測不足2</text></g><line x1="240" y1="1912" x2="240" y2="1937" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-8"><rect x="24" y="1946" width="432" height="204" rx="18" fill="#fff0f2" stroke="#be123c" stroke-width="2"/><rect x="24" y="1946" width="8" height="204" rx="4" fill="#be123c"/><rect x="43" y="1962" width="78" height="27" rx="13" fill="#be123c"/><text x="82" y="1981" text-anchor="middle" class="badge">課題</text><text x="421" y="1985" text-anchor="end" class="num">08</text><text x="44" y="2018" class="cardTitle">再試行とLab前提の差</text><text x="44" y="2049" class="body">#107：observation上限が所有者決定と差</text><text x="44" y="2076" class="body">理由が変わると試行数が増える</text><text x="44" y="2103" class="body">#213：通常機能scenarioが不足</text><text x="44" y="2130" class="body">判定条件を緩めず根因別に直す</text></g><line x1="240" y1="2155" x2="240" y2="2180" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-9"><rect x="24" y="2189" width="432" height="204" rx="18" fill="#fff0f2" stroke="#be123c" stroke-width="2"/><rect x="24" y="2189" width="8" height="204" rx="4" fill="#be123c"/><rect x="43" y="2205" width="78" height="27" rx="13" fill="#be123c"/><text x="82" y="2224" text-anchor="middle" class="badge">課題</text><text x="421" y="2228" text-anchor="end" class="num">09</text><text x="44" y="2261" class="cardTitle">review queue の実装差</text><text x="44" y="2292" class="body">mainはconfirmed等とincompleteを列挙</text><text x="44" y="2319" class="body">contradicted／未検証は件数のみ</text><text x="44" y="2346" class="body">scope内Finding全件配送の契約と差</text><text x="44" y="2373" class="body">exportの欠落を実測で確かめる</text></g><line x1="240" y1="2398" x2="240" y2="2423" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-10"><rect x="24" y="2432" width="432" height="204" rx="18" fill="#f6f0ff" stroke="#7c3aed" stroke-width="2"/><rect x="24" y="2432" width="8" height="204" rx="4" fill="#7c3aed"/><rect x="43" y="2448" width="78" height="27" rx="13" fill="#7c3aed"/><text x="82" y="2467" text-anchor="middle" class="badge">人間</text><text x="421" y="2471" text-anchor="end" class="num">10</text><text x="44" y="2504" class="cardTitle">人間が読む段階</text><text x="44" y="2535" class="body">Findingを理解し手動Labで確認</text><text x="44" y="2562" class="body">重複とprogramme scopeを査読</text><text x="44" y="2589" class="body">提出文案の版と送信先を確認</text><text x="44" y="2616" class="body">明示承認後、人間が外部へ提出</text></g><line x1="240" y1="2641" x2="240" y2="2666" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-11"><rect x="24" y="2675" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2675" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="2691" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="2710" text-anchor="middle" class="badge">提案</text><text x="421" y="2714" text-anchor="end" class="num">11</text><text x="44" y="2747" class="cardTitle">改善に返す測定</text><text x="44" y="2778" class="body">理由別incompleteとattempt／wall</text><text x="44" y="2805" class="body">reviewで開いた件数・所要時間</text><text x="44" y="2832" class="body">提出可能件数と報奨転帰を結ぶ</text><text x="44" y="2859" class="body">類似Findingは理解を軽くできる</text></g><line x1="24" y1="2931" x2="456" y2="2931" stroke="#d5dfeb"/><text x="25" y="2953" class="foot">2026-10-14 / main・公開PR・設計案を分離</text><text x="25" y="2974" class="foot">SPEC §2・§7・§8b / ADR 0031</text><text x="25" y="2994" class="foot">#107・#213 / src/review/index.ts</text></svg>
