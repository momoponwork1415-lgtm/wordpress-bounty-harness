<svg xmlns="http://www.w3.org/2000/svg" width="480" height="2738" viewBox="0 0 480 2738" role="img" aria-labelledby="title desc"><title id="title">対象選定と初回Trial</title><desc id="desc">WordPress候補列挙、現行の選定数と再候補化、旧履歴の照合、初回・追加・不明の三分岐、候補不足時の挙動を示す。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8192a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>.headTitle{font:700 29px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#fff}.headSub{font:500 16px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#d9e7fa}.pageNo{font:700 15px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#a8c2df}.cardTitle{font:700 20px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#102337}.body{font:500 16px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#24384d}.badge{font:700 14px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:white}.num{font:700 22px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#93a4b7}.legend{font:600 13px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#2b3f55}.foot{font:500 12px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#576a7f}</style><rect width="480" height="2738" fill="#f7f9fc"/><rect width="480" height="128" fill="#14283f"/><text x="25" y="49" class="pageNo">HARNESS ARCHITECTURE  2 / 5</text><text x="25" y="88" class="headTitle">対象選定と初回Trial</text><text x="25" y="115" class="headSub">既往の誤判定を防ぐ設計</text><rect x="24" y="145" width="432" height="79" rx="15" fill="#fff" stroke="#d9e2ec"/><text x="40" y="169" class="legend">状態の凡例（色と線種で区別）</text><line x1="40" y1="184" x2="64" y2="184" stroke="#0f766e" stroke-width="3"/><text x="72" y="189" class="legend">main</text><line x1="178" y1="184" x2="202" y2="184" stroke="#4f46e5" stroke-width="3" stroke-dasharray="5 3"/><text x="210" y="189" class="legend">Draft</text><line x1="316" y1="184" x2="340" y2="184" stroke="#b45309" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="189" class="legend">提案</text><line x1="40" y1="207" x2="64" y2="207" stroke="#be123c" stroke-width="3"/><text x="72" y="212" class="legend">課題</text><line x1="178" y1="207" x2="202" y2="207" stroke="#7c3aed" stroke-width="3"/><text x="210" y="212" class="legend">人間</text><line x1="316" y1="207" x2="340" y2="207" stroke="#64748b" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="212" class="legend">将来</text><g id="step-1"><rect x="24" y="245" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="245" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="261" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="280" text-anchor="middle" class="badge">main</text><text x="421" y="284" text-anchor="end" class="num">01</text><text x="44" y="317" class="cardTitle">main の選定方針</text><text x="44" y="348" class="body">active installs 下限100,000</text><text x="44" y="375" class="body">人気2頁＋8タグ各2頁を列挙</text><text x="44" y="402" class="body">最大500候補から最大5対象を選ぶ</text><text x="44" y="429" class="body">順位はinstall数と更新の新しさ</text></g><line x1="240" y1="454" x2="240" y2="479" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-2"><rect x="24" y="488" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="488" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="504" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="523" text-anchor="middle" class="badge">main</text><text x="421" y="527" text-anchor="end" class="num">02</text><text x="44" y="560" class="cardTitle">観測と適格性の検査</text><text x="44" y="591" class="body">WordPress.org／Programmeを観測</text><text x="44" y="618" class="body">鮮度・版・除外作者を確認</text><text x="44" y="645" class="body">unavailable／staleはeligibleにしない</text><text x="44" y="672" class="body">公開脆弱性履歴で個別順位付けしない</text></g><line x1="240" y1="697" x2="240" y2="722" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-3"><rect x="24" y="731" width="432" height="204" rx="18" fill="#fff0f2" stroke="#be123c" stroke-width="2"/><rect x="24" y="731" width="8" height="204" rx="4" fill="#be123c"/><rect x="43" y="747" width="78" height="27" rx="13" fill="#be123c"/><text x="82" y="766" text-anchor="middle" class="badge">課題</text><text x="421" y="770" text-anchor="end" class="num">03</text><text x="44" y="803" class="cardTitle">現行の再候補化は新方針と衝突</text><text x="44" y="834" class="body">mainは版またはprompt変更で再候補</text><text x="44" y="861" class="body">選定済み記録も既往判定に使用</text><text x="44" y="888" class="body">所有者方針はslug単位の初回のみ自動</text><text x="44" y="915" class="body">新版の2回目も毎Trial承認が必要</text></g><line x1="240" y1="940" x2="240" y2="965" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-4"><rect x="24" y="974" width="432" height="204" rx="18" fill="#f0efff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="974" width="8" height="204" rx="4" fill="#4f46e5"/><rect x="43" y="990" width="78" height="27" rx="13" fill="#4f46e5"/><text x="82" y="1009" text-anchor="middle" class="badge">Draft</text><text x="421" y="1013" text-anchor="end" class="num">04</text><text x="44" y="1046" class="cardTitle">横断ガードはPR #216</text><text x="44" y="1077" class="body">ホスト共通Trial registryを追加</text><text x="44" y="1104" class="body">既知22 stateの開始141件を復元</text><text x="44" y="1131" class="body">ただし旧DB・アーカイブは未網羅</text><text x="44" y="1158" class="body">Draftで新しい実対象Trialは未実施</text></g><line x1="240" y1="1183" x2="240" y2="1208" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-5"><rect x="24" y="1217" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1217" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="1233" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="1252" text-anchor="middle" class="badge">提案</text><text x="421" y="1256" text-anchor="end" class="num">05</text><text x="44" y="1289" class="cardTitle">候補在庫は軽いメタデータ</text><text x="44" y="1320" class="body">初回と証明できるslugを順位付き保持</text><text x="44" y="1347" class="body">24時間分は補充目安、終了期限でない</text><text x="44" y="1374" class="body">Snapshot／Labは起動直前まで作らない</text><text x="44" y="1401" class="body">方針ID・観測時刻・出典を保持</text></g><line x1="240" y1="1426" x2="240" y2="1451" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-6"><rect x="24" y="1460" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1460" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="1476" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="1495" text-anchor="middle" class="badge">提案</text><text x="421" y="1499" text-anchor="end" class="num">06</text><text x="44" y="1532" class="cardTitle">実行直前の再検査と予約</text><text x="44" y="1563" class="body">鮮度・Programme・版を再観測</text><text x="44" y="1590" class="body">全campaign／providerの開始履歴を照合</text><text x="44" y="1617" class="body">対象claimを原子的に取得</text><text x="44" y="1644" class="body">その後Snapshotをdigest固定</text></g><line x1="240" y1="1669" x2="240" y2="1694" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-7"><rect x="24" y="1703" width="432" height="177" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1703" width="8" height="177" rx="4" fill="#b45309"/><rect x="43" y="1719" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="1738" text-anchor="middle" class="badge">提案</text><text x="421" y="1742" text-anchor="end" class="num">A</text><text x="44" y="1775" class="cardTitle">分岐A：未探索を確認</text><text x="44" y="1806" class="body">初回の単一協調Trialを自動開始</text><text x="44" y="1833" class="body">選定だけではTrialを消費しない</text><text x="44" y="1860" class="body">開始eventで実探索を記録</text></g><g id="step-8"><rect x="24" y="1919" width="432" height="177" rx="18" fill="#f6f0ff" stroke="#7c3aed" stroke-width="2"/><rect x="24" y="1919" width="8" height="177" rx="4" fill="#7c3aed"/><rect x="43" y="1935" width="78" height="27" rx="13" fill="#7c3aed"/><text x="82" y="1954" text-anchor="middle" class="badge">人間</text><text x="421" y="1958" text-anchor="end" class="num">B</text><text x="44" y="1991" class="cardTitle">分岐B：既往slug</text><text x="44" y="2022" class="body">新版・新promptでも初回に戻さない</text><text x="44" y="2049" class="body">Finding等を見て追加目的を決める</text><text x="44" y="2076" class="body">独立Trialごとに事前承認</text></g><g id="step-9"><rect x="24" y="2135" width="432" height="177" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2135" width="8" height="177" rx="4" fill="#b45309"/><rect x="43" y="2151" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="2170" text-anchor="middle" class="badge">提案</text><text x="421" y="2174" text-anchor="end" class="num">C</text><text x="44" y="2207" class="cardTitle">分岐C：旧履歴が曖昧</text><text x="44" y="2238" class="body">初回の自動在庫から外して保留</text><text x="44" y="2265" class="body">旧DB・アーカイブと照合して解除</text><text x="44" y="2292" class="body">不明を未探索と推定しない</text></g><g id="step-10"><rect x="24" y="2351" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2351" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="2367" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="2386" text-anchor="middle" class="badge">提案</text><text x="421" y="2390" text-anchor="end" class="num">10</text><text x="44" y="2423" class="cardTitle">候補不足と方針変更</text><text x="44" y="2454" class="body">許可済みの列挙範囲で追加取得</text><text x="44" y="2481" class="body">一部取得失敗は枯渇と数えない</text><text x="44" y="2508" class="body">本当に尽きたらreview待ち</text><text x="44" y="2535" class="body">install帯・カテゴリは人間が版変更</text></g><line x1="24" y1="2607" x2="456" y2="2607" stroke="#d5dfeb"/><text x="25" y="2629" class="foot">2026-10-14 / main・公開PR・設計案を分離</text><text x="25" y="2650" class="foot">selection.json / ADR 0030・0032</text><text x="25" y="2670" class="foot">#215 / Draft PR #216</text></svg>
