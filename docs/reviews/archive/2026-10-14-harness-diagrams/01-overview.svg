<svg xmlns="http://www.w3.org/2000/svg" width="480" height="2981" viewBox="0 0 480 2981" role="img" aria-labelledby="title desc"><title id="title">全体像と責任の境界</title><desc id="desc">人間の戦略設定から対象選定、Snapshot、gVisor Lab、単一協調Trial、独立検証、台帳、レビュー、人間による提出、改善までの全体像。main実装、Draft、提案を区別。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8192a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>.headTitle{font:700 29px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#fff}.headSub{font:500 16px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#d9e7fa}.pageNo{font:700 15px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#a8c2df}.cardTitle{font:700 20px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#102337}.body{font:500 16px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#24384d}.badge{font:700 14px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:white}.num{font:700 22px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#93a4b7}.legend{font:600 13px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#2b3f55}.foot{font:500 12px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#576a7f}</style><rect width="480" height="2981" fill="#f7f9fc"/><rect width="480" height="128" fill="#14283f"/><text x="25" y="49" class="pageNo">HARNESS ARCHITECTURE  1 / 5</text><text x="25" y="88" class="headTitle">全体像と責任の境界</text><text x="25" y="115" class="headSub">現在の主経路＋次期の連続運転案</text><rect x="24" y="145" width="432" height="79" rx="15" fill="#fff" stroke="#d9e2ec"/><text x="40" y="169" class="legend">状態の凡例（色と線種で区別）</text><line x1="40" y1="184" x2="64" y2="184" stroke="#0f766e" stroke-width="3"/><text x="72" y="189" class="legend">main</text><line x1="178" y1="184" x2="202" y2="184" stroke="#4f46e5" stroke-width="3" stroke-dasharray="5 3"/><text x="210" y="189" class="legend">Draft</text><line x1="316" y1="184" x2="340" y2="184" stroke="#b45309" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="189" class="legend">提案</text><line x1="40" y1="207" x2="64" y2="207" stroke="#be123c" stroke-width="3"/><text x="72" y="212" class="legend">課題</text><line x1="178" y1="207" x2="202" y2="207" stroke="#7c3aed" stroke-width="3"/><text x="210" y="212" class="legend">人間</text><line x1="316" y1="207" x2="340" y2="207" stroke="#64748b" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="212" class="legend">将来</text><g id="step-1"><rect x="24" y="245" width="432" height="177" rx="18" fill="#f6f0ff" stroke="#7c3aed" stroke-width="2"/><rect x="24" y="245" width="8" height="177" rx="4" fill="#7c3aed"/><rect x="43" y="261" width="78" height="27" rx="13" fill="#7c3aed"/><text x="82" y="280" text-anchor="middle" class="badge">人間</text><text x="421" y="284" text-anchor="end" class="num">01</text><text x="44" y="317" class="cardTitle">人間が戦略と方針を決める</text><text x="44" y="348" class="body">対象帯・カテゴリ・Programmeを設定</text><text x="44" y="375" class="body">運転開始／停止、追加Trialを承認</text><text x="44" y="402" class="body">AIはログから改善案を出す</text></g><line x1="240" y1="427" x2="240" y2="452" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-2"><rect x="24" y="461" width="432" height="177" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="461" width="8" height="177" rx="4" fill="#0f766e"/><rect x="43" y="477" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="496" text-anchor="middle" class="badge">main</text><text x="421" y="500" text-anchor="end" class="num">02</text><text x="44" y="533" class="cardTitle">selection：対象を選ぶ</text><text x="44" y="564" class="body">WordPress.org と公開履歴を観測</text><text x="44" y="591" class="body">main は上位3〜5件の固定batch</text><text x="44" y="618" class="body">継続在庫と自動補充は未実装</text></g><line x1="240" y1="643" x2="240" y2="668" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-3"><rect x="24" y="677" width="432" height="177" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="677" width="8" height="177" rx="4" fill="#0f766e"/><rect x="43" y="693" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="712" text-anchor="middle" class="badge">main</text><text x="421" y="716" text-anchor="end" class="num">03</text><text x="44" y="749" class="cardTitle">snapshot：sourceを固定</text><text x="44" y="780" class="body">plugin＋WordPress coreをdigest固定</text><text x="44" y="807" class="body">公開履歴は時点で切ったカタログ</text><text x="44" y="834" class="body">評価の答え・PoCは渡さない</text></g><line x1="240" y1="859" x2="240" y2="884" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-4"><rect x="24" y="893" width="432" height="177" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="893" width="8" height="177" rx="4" fill="#0f766e"/><rect x="43" y="909" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="928" text-anchor="middle" class="badge">main</text><text x="421" y="932" text-anchor="end" class="num">04</text><text x="44" y="965" class="cardTitle">lab：使い捨て環境</text><text x="44" y="996" class="body">gVisor（runsc）内にWP＋MySQL</text><text x="44" y="1023" class="body">低権限認証とRO DBを供給</text><text x="44" y="1050" class="body">対象コードはホストで動かさない</text></g><line x1="240" y1="1075" x2="240" y2="1100" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-5"><rect x="24" y="1109" width="432" height="177" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="1109" width="8" height="177" rx="4" fill="#0f766e"/><rect x="43" y="1125" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="1144" text-anchor="middle" class="badge">main</text><text x="421" y="1148" text-anchor="end" class="num">05</text><text x="44" y="1181" class="cardTitle">discovery：1対象1 Trial</text><text x="44" y="1212" class="body">Codex Root＋最大3子が協調探索</text><text x="44" y="1239" class="body">wall上限60分、早期報告で終了</text><text x="44" y="1266" class="body">子のFinding／Leadも独立保存</text></g><line x1="240" y1="1291" x2="240" y2="1316" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-6"><rect x="24" y="1325" width="432" height="177" rx="18" fill="#f0efff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1325" width="8" height="177" rx="4" fill="#4f46e5"/><rect x="43" y="1341" width="78" height="27" rx="13" fill="#4f46e5"/><text x="82" y="1360" text-anchor="middle" class="badge">Draft</text><text x="421" y="1364" text-anchor="end" class="num">06</text><text x="44" y="1397" class="cardTitle">探索版とproviderの拡張</text><text x="44" y="1428" class="body">main既定はv3、v4はPR #217</text><text x="44" y="1455" class="body">Opus経路はPR #225のDraft</text><text x="44" y="1482" class="body">異なる版を同じ評価分母に混ぜない</text></g><line x1="240" y1="1507" x2="240" y2="1532" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-7"><rect x="24" y="1541" width="432" height="177" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="1541" width="8" height="177" rx="4" fill="#0f766e"/><rect x="43" y="1557" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="1576" text-anchor="middle" class="badge">main</text><text x="421" y="1580" text-anchor="end" class="num">07</text><text x="44" y="1613" class="cardTitle">出力を正規化し振り分ける</text><text x="44" y="1644" class="body">Finding／Leadを受理または保留</text><text x="44" y="1671" class="body">Programme外のimpactはpark</text><text x="44" y="1698" class="body">scope内Findingを独立検証へ</text></g><line x1="240" y1="1723" x2="240" y2="1748" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-8"><rect x="24" y="1757" width="432" height="177" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="1757" width="8" height="177" rx="4" fill="#0f766e"/><rect x="43" y="1773" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="1792" text-anchor="middle" class="badge">main</text><text x="421" y="1796" text-anchor="end" class="num">08</text><text x="44" y="1829" class="cardTitle">verification：独立検証</text><text x="44" y="1860" class="body">新しいLabとVerifierで確認</text><text x="44" y="1887" class="body">Harness判定器がnonceを回収</text><text x="44" y="1914" class="body">失敗は理由付きincomplete</text></g><line x1="240" y1="1939" x2="240" y2="1964" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-9"><rect x="24" y="1973" width="432" height="177" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="1973" width="8" height="177" rx="4" fill="#0f766e"/><rect x="43" y="1989" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="2008" text-anchor="middle" class="badge">main</text><text x="421" y="2012" text-anchor="end" class="num">09</text><text x="44" y="2045" class="cardTitle">ledger と Private Evidence</text><text x="44" y="2076" class="body">台帳は追記専用でdigest参照のみ</text><text x="44" y="2103" class="body">HTTP・payload・ログはGit外</text><text x="44" y="2130" class="body">Trialと検証の由来を追跡</text></g><line x1="240" y1="2155" x2="240" y2="2180" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-10"><rect x="24" y="2189" width="432" height="177" rx="18" fill="#fff0f2" stroke="#be123c" stroke-width="2"/><rect x="24" y="2189" width="8" height="177" rx="4" fill="#be123c"/><rect x="43" y="2205" width="78" height="27" rx="13" fill="#be123c"/><text x="82" y="2224" text-anchor="middle" class="badge">課題</text><text x="421" y="2228" text-anchor="end" class="num">10</text><text x="44" y="2261" class="cardTitle">review queue の現行差分</text><text x="44" y="2292" class="body">mainはconfirmed等とincompleteを列挙</text><text x="44" y="2319" class="body">contradicted／未検証は件数のみ</text><text x="44" y="2346" class="body">scope内全件配送の契約と要照合</text></g><line x1="240" y1="2371" x2="240" y2="2396" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-11"><rect x="24" y="2405" width="432" height="177" rx="18" fill="#f6f0ff" stroke="#7c3aed" stroke-width="2"/><rect x="24" y="2405" width="8" height="177" rx="4" fill="#7c3aed"/><rect x="43" y="2421" width="78" height="27" rx="13" fill="#7c3aed"/><text x="82" y="2440" text-anchor="middle" class="badge">人間</text><text x="421" y="2444" text-anchor="end" class="num">11</text><text x="44" y="2477" class="cardTitle">人間が理解・確認・提出</text><text x="44" y="2508" class="body">手動Lab再現、重複・scope査読</text><text x="44" y="2535" class="body">文案を確認し外部行動を承認</text><text x="44" y="2562" class="body">Harnessは送信せず、人間が提出</text></g><line x1="240" y1="2587" x2="240" y2="2612" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-12"><rect x="24" y="2621" width="432" height="177" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2621" width="8" height="177" rx="4" fill="#b45309"/><rect x="43" y="2637" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="2656" text-anchor="middle" class="badge">提案</text><text x="421" y="2660" text-anchor="end" class="num">12</text><text x="44" y="2693" class="cardTitle">転帰を次の方針へ戻す</text><text x="44" y="2724" class="body">報奨とreview負荷をrunへ結ぶ</text><text x="44" y="2751" class="body">AIがログを読み改善案を提案</text><text x="44" y="2778" class="body">仕様・戦略の採否は人間が決定</text></g><line x1="24" y1="2850" x2="456" y2="2850" stroke="#d5dfeb"/><text x="25" y="2872" class="foot">2026-10-14 / main・公開PR・設計案を分離</text><text x="25" y="2893" class="foot">SPEC §2–10 / DESIGN-DIAGRAMS</text><text x="25" y="2913" class="foot">DEVELOPMENT §2 / PR #197・#203</text></svg>
