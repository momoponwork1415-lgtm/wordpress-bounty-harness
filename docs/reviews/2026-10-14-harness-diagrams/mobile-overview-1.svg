<text x="326" y="803" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#475569">04</text>
<text x="32" y="833" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">lab：使い捨て環境</text>
<text x="32" y="871" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">gVisor（runsc）内にWP＋MySQL</text>
<text x="32" y="894" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">低権限認証とRO DBを供給</text>
