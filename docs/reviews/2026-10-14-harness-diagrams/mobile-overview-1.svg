<rect x="32" y="189" width="78" height="26" rx="13" fill="#7c3aed"/><text x="71" y="207" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">人間</text>
<text x="326" y="208" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#475569">01</text>
<text x="32" y="238" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">人間が戦略と方針を決める</text>
<text x="32" y="276" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">対象帯・カテゴリ・Programmeを設</text>
<text x="32" y="299" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">定</text>
<text x="32" y="322" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">運転開始／停止、追加Trialを承認</text>
<text x="32" y="345" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">AIはログから改善案を出す</text>
</g>
<g id="step-2"><rect x="16" y="381" width="328" height="167" rx="16" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/>
