<rect x="32" y="578" width="78" height="26" rx="13" fill="#0f766e"/><text x="71" y="596" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#fff">main</text>
<text x="326" y="597" font-family="system-ui,sans-serif" font-size="14" font-weight="700" text-anchor="end" fill="#475569">03</text>
<text x="32" y="627" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">snapshot：sourceを固定</text>
<text x="32" y="665" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">plugin＋WordPress coreをdig</text>
<text x="32" y="688" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">est固定</text>
<text x="32" y="711" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">公開履歴は時点で切ったカタログ</text>
<text x="32" y="734" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">評価の答え・PoCは渡さない</text>
