<svg xmlns="http://www.w3.org/2000/svg" width="320" height="860" viewBox="0 0 360 967" style="max-width:100%;height:auto" role="img" aria-labelledby="title-overview-1 desc-overview-1">
<title id="title-overview-1">全体像 1/3</title><desc id="desc-overview-1">人間の戦略設定から発見・検証・レビュー・改善まで。項目 1、2、3、4。</desc>
