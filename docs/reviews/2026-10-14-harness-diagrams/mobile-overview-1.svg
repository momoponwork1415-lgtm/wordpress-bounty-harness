<text x="32" y="444" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#0f172a">selection：対象を選ぶ</text>
<text x="32" y="482" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">WordPress.org と公開履歴を観測</text>
<text x="32" y="505" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">main は上位3〜5件の固定batch</text>
<text x="32" y="528" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">継続在庫と自動補充は未実装</text>
</g>
<g id="step-3"><rect x="16" y="564" width="328" height="190" rx="16" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/>
