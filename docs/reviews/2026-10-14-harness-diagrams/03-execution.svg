<svg xmlns="http://www.w3.org/2000/svg" width="480" height="2819" viewBox="0 0 480 2819" role="img" aria-labelledby="title desc"><title id="title">並列実行と資源管理</title><desc id="desc">現行campaign内二並列とRoot子エージェント、CodexとOpusの状況、グローバル対象予約、PC資源枠、quota待ちを図解。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8192a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>.headTitle{font:700 29px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#fff}.headSub{font:500 16px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#d9e7fa}.pageNo{font:700 15px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#a8c2df}.cardTitle{font:700 20px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#102337}.body{font:500 16px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#24384d}.badge{font:700 14px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:white}.num{font:700 22px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#93a4b7}.legend{font:600 13px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#2b3f55}.foot{font:500 12px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#576a7f}</style><rect width="480" height="2819" fill="#f7f9fc"/><rect width="480" height="128" fill="#14283f"/><text x="25" y="49" class="pageNo">HARNESS ARCHITECTURE  3 / 5</text><text x="25" y="88" class="headTitle">並列実行と資源管理</text><text x="25" y="115" class="headSub">1 campaignの実装と横断運転の差</text><rect x="24" y="145" width="432" height="79" rx="15" fill="#fff" stroke="#d9e2ec"/><text x="40" y="169" class="legend">状態の凡例（色と線種で区別）</text><line x1="40" y1="184" x2="64" y2="184" stroke="#0f766e" stroke-width="3"/><text x="72" y="189" class="legend">main</text><line x1="178" y1="184" x2="202" y2="184" stroke="#4f46e5" stroke-width="3" stroke-dasharray="5 3"/><text x="210" y="189" class="legend">Draft</text><line x1="316" y1="184" x2="340" y2="184" stroke="#b45309" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="189" class="legend">提案</text><line x1="40" y1="207" x2="64" y2="207" stroke="#be123c" stroke-width="3"/><text x="72" y="212" class="legend">課題</text><line x1="178" y1="207" x2="202" y2="207" stroke="#7c3aed" stroke-width="3"/><text x="210" y="212" class="legend">人間</text><line x1="316" y1="207" x2="340" y2="207" stroke="#64748b" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="212" class="legend">将来</text><g id="step-1"><rect x="24" y="245" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="245" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="261" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="280" text-anchor="middle" class="badge">main</text><text x="421" y="284" text-anchor="end" class="num">01</text><text x="44" y="317" class="cardTitle">固定campaignを実行</text><text x="44" y="348" class="body">選定した対象集合をbatchに固定</text><text x="44" y="375" class="body">対象間は最大2並列</text><text x="44" y="402" class="body">対象内のTrialは最大1</text><text x="44" y="429" class="body">各対象でLabとcleanupを分離</text></g><line x1="240" y1="454" x2="240" y2="479" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-2"><rect x="24" y="488" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="488" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="504" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="523" text-anchor="middle" class="badge">main</text><text x="421" y="527" text-anchor="end" class="num">02</text><text x="44" y="560" class="cardTitle">単一協調Trialの内部</text><text x="44" y="591" class="body">Root＋最大3子、wall上限60分</text><text x="44" y="618" class="body">続行差し込み・自動追加Trialなし</text><text x="44" y="645" class="body">子の有効成果はRootと独立保存</text><text x="44" y="672" class="body">失敗は正常な候補0件にしない</text></g><line x1="240" y1="697" x2="240" y2="722" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-3"><rect x="24" y="731" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="731" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="747" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="766" text-anchor="middle" class="badge">main</text><text x="421" y="770" text-anchor="end" class="num">03</text><text x="44" y="803" class="cardTitle">main の停止・再開</text><text x="44" y="834" class="body">provider上限で新規対象開始を止める</text><text x="44" y="861" class="body">実行中の対象は結果を記録</text><text x="44" y="888" class="body">同一campaign IDの再実行で</text><text x="44" y="915" class="body">完了済みを飛ばし未完了を続行</text></g><line x1="240" y1="940" x2="240" y2="965" stroke="#8192a6" stroke-width="2.5" marker-end="url(#arrow)"/><g id="step-4"><rect x="24" y="974" width="432" height="204" rx="18" fill="#fff0f2" stroke="#be123c" stroke-width="2"/><rect x="24" y="974" width="8" height="204" rx="4" fill="#be123c"/><rect x="43" y="990" width="78" height="27" rx="13" fill="#be123c"/><text x="82" y="1009" text-anchor="middle" class="badge">課題</text><text x="421" y="1013" text-anchor="end" class="num">04</text><text x="44" y="1046" class="cardTitle">campaign を越える制御がない</text><text x="44" y="1077" class="body">次batchの自動補充は未実装</text><text x="44" y="1104" class="body">別state／providerの同slug予約なし</text><text x="44" y="1131" class="body">PC全体のCPU・RAM枠の仲裁なし</text><text x="44" y="1158" class="body">長期運転の監督プロセスも未実装</text></g><line x1="240" y1="1183" x2="240" y2="1208" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-5"><rect x="24" y="1217" width="432" height="204" rx="18" fill="#f0efff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1217" width="8" height="204" rx="4" fill="#4f46e5"/><rect x="43" y="1233" width="78" height="27" rx="13" fill="#4f46e5"/><text x="82" y="1252" text-anchor="middle" class="badge">Draft</text><text x="421" y="1256" text-anchor="end" class="num">05</text><text x="44" y="1289" class="cardTitle">Opus探索はPR #225</text><text x="44" y="1320" class="body">購読token経路とbrokerを追加中</text><text x="44" y="1347" class="body">実対象2 Trialは両方incomplete</text><text x="44" y="1374" class="body">Root完走0、横断2＋2並列未測定</text><text x="44" y="1401" class="body">本番の共通資源枠には未接続</text></g><line x1="240" y1="1426" x2="240" y2="1451" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-6"><rect x="24" y="1460" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1460" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="1476" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="1495" text-anchor="middle" class="badge">提案</text><text x="421" y="1499" text-anchor="end" class="num">06</text><text x="44" y="1532" class="cardTitle">親運転IDでbatchをつなぐ</text><text x="44" y="1563" class="body">campaignの対象集合は不変のまま</text><text x="44" y="1590" class="body">親IDが複数campaignを順次生成</text><text x="44" y="1617" class="body">在庫が減れば次batchを補充</text><text x="44" y="1644" class="body">Trial結果は既存の追記台帳へ</text></g><line x1="240" y1="1669" x2="240" y2="1694" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-7"><rect x="24" y="1703" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1703" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="1719" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="1738" text-anchor="middle" class="badge">提案</text><text x="421" y="1742" text-anchor="end" class="num">07</text><text x="44" y="1775" class="cardTitle">共通の対象claim</text><text x="44" y="1806" class="body">profile＋slugをホスト共通で予約</text><text x="44" y="1833" class="body">同時起動はleaseとfencingで排他</text><text x="44" y="1860" class="body">旧履歴が不明なら開始を拒否</text><text x="44" y="1887" class="body">運用表は台帳から再照合できる</text></g><line x1="240" y1="1912" x2="240" y2="1937" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-8"><rect x="24" y="1946" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1946" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="1962" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="1981" text-anchor="middle" class="badge">提案</text><text x="421" y="1985" text-anchor="end" class="num">08</text><text x="44" y="2018" class="cardTitle">共通のPC資源枠</text><text x="44" y="2049" class="body">CPU・RAM・Lab・Trial slotを予約</text><text x="44" y="2076" class="body">provider別の同時枠も同じ門で管理</text><text x="44" y="2103" class="body">Opusは最大2、全体は実測で調整</text><text x="44" y="2130" class="body">初期並列は現行の2を維持</text></g><line x1="240" y1="2155" x2="240" y2="2180" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-9"><rect x="24" y="2189" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2189" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="2205" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="2224" text-anchor="middle" class="badge">提案</text><text x="421" y="2228" text-anchor="end" class="num">09</text><text x="44" y="2261" class="cardTitle">quota 到達時</text><text x="44" y="2292" class="body">該当providerの新規開始を待機</text><text x="44" y="2319" class="body">別providerは別の初回slugを処理</text><text x="44" y="2346" class="body">5時間・週次枠の回復後にpreflight</text><text x="44" y="2373" class="body">従量課金へ暗黙に切り替えない</text></g><line x1="240" y1="2398" x2="240" y2="2423" stroke="#8192a6" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/><g id="step-10"><rect x="24" y="2432" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2432" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="2448" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="2467" text-anchor="middle" class="badge">提案</text><text x="421" y="2471" text-anchor="end" class="num">10</text><text x="44" y="2504" class="cardTitle">重複なく復旧</text><text x="44" y="2535" class="body">台帳・運用表・容器を照合</text><text x="44" y="2562" class="body">開始済みTrialを勝手に再探索しない</text><text x="44" y="2589" class="body">子の保存済み成果と検証を回収</text><text x="44" y="2616" class="body">曖昧な対象だけ保留する</text></g><line x1="24" y1="2688" x2="456" y2="2688" stroke="#d5dfeb"/><text x="25" y="2710" class="foot">2026-10-14 / main・公開PR・設計案を分離</text><text x="25" y="2731" class="foot">PR #203 / campaign.json</text><text x="25" y="2751" class="foot">Draft PR #225 / #215</text></svg>
