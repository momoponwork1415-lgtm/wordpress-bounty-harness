<svg xmlns="http://www.w3.org/2000/svg" width="480" height="3062" viewBox="0 0 480 3062" role="img" aria-labelledby="title desc"><title id="title">継続運転と現在地</title><desc id="desc">複数batch補充、quota待ち、通常停止、緊急停止、異常復旧、監視、現在の障害、Step1の実装順と将来像を示す。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#8192a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><style>.headTitle{font:700 29px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#fff}.headSub{font:500 16px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#d9e7fa}.pageNo{font:700 15px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#a8c2df}.cardTitle{font:700 20px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#102337}.body{font:500 16px "Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;fill:#24384d}.badge{font:700 14px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:white}.num{font:700 22px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#93a4b7}.legend{font:600 13px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#2b3f55}.foot{font:500 12px "Noto Sans JP","Yu Gothic",Meiryo,sans-serif;fill:#576a7f}</style><rect width="480" height="3062" fill="#f7f9fc"/><rect width="480" height="128" fill="#14283f"/><text x="25" y="49" class="pageNo">HARNESS ARCHITECTURE  5 / 5</text><text x="25" y="88" class="headTitle">継続運転と現在地</text><text x="25" y="115" class="headSub">待機・停止・復旧の状態と実装差分</text><rect x="24" y="145" width="432" height="79" rx="15" fill="#fff" stroke="#d9e2ec"/><text x="40" y="169" class="legend">状態の凡例（色と線種で区別）</text><line x1="40" y1="184" x2="64" y2="184" stroke="#0f766e" stroke-width="3"/><text x="72" y="189" class="legend">main</text><line x1="178" y1="184" x2="202" y2="184" stroke="#4f46e5" stroke-width="3" stroke-dasharray="5 3"/><text x="210" y="189" class="legend">Draft</text><line x1="316" y1="184" x2="340" y2="184" stroke="#b45309" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="189" class="legend">提案</text><line x1="40" y1="207" x2="64" y2="207" stroke="#be123c" stroke-width="3"/><text x="72" y="212" class="legend">課題</text><line x1="178" y1="207" x2="202" y2="207" stroke="#7c3aed" stroke-width="3"/><text x="210" y="212" class="legend">人間</text><line x1="316" y1="207" x2="340" y2="207" stroke="#64748b" stroke-width="3" stroke-dasharray="5 3"/><text x="348" y="212" class="legend">将来</text><g id="step-1"><rect x="24" y="245" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="245" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="261" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="280" text-anchor="middle" class="badge">提案</text><text x="421" y="284" text-anchor="end" class="num">01</text><text x="44" y="317" class="cardTitle">RUNNING：未探索対象を補充</text><text x="44" y="348" class="body">親運転IDの下で固定batchを連続生成</text><text x="44" y="375" class="body">24時間は在庫量の目安だけ</text><text x="44" y="402" class="body">本人が止めるまで期限は置かない</text><text x="44" y="429" class="body">初回slugだけ安全に開始</text></g><g id="step-2"><rect x="24" y="488" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="488" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="504" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="523" text-anchor="middle" class="badge">提案</text><text x="421" y="527" text-anchor="end" class="num">02</text><text x="44" y="560" class="cardTitle">WAIT_QUOTA：枠の回復待ち</text><text x="44" y="591" class="body">5時間・週次枠の上限を記録</text><text x="44" y="618" class="body">別providerが動ければ別slugを継続</text><text x="44" y="645" class="body">回復後preflightを通して再開</text><text x="44" y="672" class="body">開始済みTrialは自動でやり直さない</text></g><g id="step-3"><rect x="24" y="731" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="731" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="747" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="766" text-anchor="middle" class="badge">提案</text><text x="421" y="770" text-anchor="end" class="num">03</text><text x="44" y="803" class="cardTitle">WAIT_REVIEW：候補が尽きる</text><text x="44" y="834" class="body">許可された候補源を調べ切る</text><text x="44" y="861" class="body">履歴不明と追加Trial承認待ちは分離</text><text x="44" y="888" class="body">方針をAIが自動で緩めない</text><text x="44" y="915" class="body">新しい方針か候補源を人間が判断</text></g><g id="step-4"><rect x="24" y="974" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="974" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="990" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="1009" text-anchor="middle" class="badge">提案</text><text x="421" y="1013" text-anchor="end" class="num">04</text><text x="44" y="1046" class="cardTitle">STOPPING：通常停止</text><text x="44" y="1077" class="body">新規claimを停止</text><text x="44" y="1104" class="body">進行中Trialは各wall上限で完了</text><text x="44" y="1131" class="body">検証・exportまで記録して終了</text><text x="44" y="1158" class="body">緊急停止は別の操作</text></g><g id="step-5"><rect x="24" y="1217" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1217" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="1233" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="1252" text-anchor="middle" class="badge">提案</text><text x="421" y="1256" text-anchor="end" class="num">05</text><text x="44" y="1289" class="cardTitle">RECOVERING：異常後に照合</text><text x="44" y="1320" class="body">OSサービスが監督プロセスを再起動</text><text x="44" y="1347" class="body">台帳・予約表・実容器を照合</text><text x="44" y="1374" class="body">不明な対象は保留、成果を回収</text><text x="44" y="1401" class="body">隔離／broker違反は全体停止</text></g><g id="step-6"><rect x="24" y="1460" width="432" height="204" rx="18" fill="#e9f8f3" stroke="#0f766e" stroke-width="2"/><rect x="24" y="1460" width="8" height="204" rx="4" fill="#0f766e"/><rect x="43" y="1476" width="78" height="27" rx="13" fill="#0f766e"/><text x="82" y="1495" text-anchor="middle" class="badge">main</text><text x="421" y="1499" text-anchor="end" class="num">06</text><text x="44" y="1532" class="cardTitle">main が今できること</text><text x="44" y="1563" class="body">1 campaign内の対象2並列</text><text x="44" y="1590" class="body">#203：provider停止と同ID再開</text><text x="44" y="1617" class="body">review exportとLab前後差分あり</text><text x="44" y="1644" class="body">固定batchを消費すると終了</text></g><g id="step-7"><rect x="24" y="1703" width="432" height="204" rx="18" fill="#fff0f2" stroke="#be123c" stroke-width="2"/><rect x="24" y="1703" width="8" height="204" rx="4" fill="#be123c"/><rect x="43" y="1719" width="78" height="27" rx="13" fill="#be123c"/><text x="82" y="1738" text-anchor="middle" class="badge">課題</text><text x="421" y="1742" text-anchor="end" class="num">07</text><text x="44" y="1775" class="cardTitle">今の実測障害</text><text x="44" y="1806" class="body">#213：Labの通常機能前提不足</text><text x="44" y="1833" class="body">#222：権限設定でLabがsource読取失敗</text><text x="44" y="1860" class="body">#223：source取得タイムアウト</text><text x="44" y="1887" class="body">#220：Draft系Trialがprovider拒否</text></g><g id="step-8"><rect x="24" y="1946" width="432" height="204" rx="18" fill="#f0efff" stroke="#4f46e5" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="1946" width="8" height="204" rx="4" fill="#4f46e5"/><rect x="43" y="1962" width="78" height="27" rx="13" fill="#4f46e5"/><text x="82" y="1981" text-anchor="middle" class="badge">Draft</text><text x="421" y="1985" text-anchor="end" class="num">08</text><text x="44" y="2018" class="cardTitle">まだ本番基線でない変更</text><text x="44" y="2049" class="body">#216：追加Trial承認ガード</text><text x="44" y="2076" class="body">#217：重大影響向けv4 prompt</text><text x="44" y="2103" class="body">#225：Opus経路（完走0）</text><text x="44" y="2130" class="body">どれもmainへ未mergeのDraft</text></g><g id="step-9"><rect x="24" y="2189" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2189" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="2205" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="2224" text-anchor="middle" class="badge">提案</text><text x="421" y="2228" text-anchor="end" class="num">09</text><text x="44" y="2261" class="cardTitle">Step 1 の実装順</text><text x="44" y="2292" class="body">①既存候補レビュー＋検証理由を改善</text><text x="44" y="2319" class="body">②旧履歴を照合し重複開始を防止</text><text x="44" y="2346" class="body">③補充・横断資源枠・quota待ち</text><text x="44" y="2373" class="body">④1週分を無人で試験</text></g><g id="step-10"><rect x="24" y="2432" width="432" height="204" rx="18" fill="#fff7e7" stroke="#b45309" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2432" width="8" height="204" rx="4" fill="#b45309"/><rect x="43" y="2448" width="78" height="27" rx="13" fill="#b45309"/><text x="82" y="2467" text-anchor="middle" class="badge">提案</text><text x="421" y="2471" text-anchor="end" class="num">10</text><text x="44" y="2504" class="cardTitle">合格を示す数字</text><text x="44" y="2535" class="body">scope内Findingのexport欠落0</text><text x="44" y="2562" class="body">無承認の同slug追加Trial 0</text><text x="44" y="2589" class="body">中断を正常0件と誤算0</text><text x="44" y="2616" class="body">枠回復・再起動後の重複0</text></g><g id="step-11"><rect x="24" y="2675" width="432" height="204" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/><rect x="24" y="2675" width="8" height="204" rx="4" fill="#64748b"/><rect x="43" y="2691" width="78" height="27" rx="13" fill="#64748b"/><text x="82" y="2710" text-anchor="middle" class="badge">将来</text><text x="421" y="2714" text-anchor="end" class="num">11</text><text x="44" y="2747" class="cardTitle">その先の拡張</text><text x="44" y="2778" class="body">他プラットフォームのprofile</text><text x="44" y="2805" class="body">Mantis等への探索方式切替</text><text x="44" y="2832" class="body">ログをAIと人間で見て改善</text><text x="44" y="2859" class="body">変更採否は人間が設計承認</text></g><line x1="24" y1="2931" x2="456" y2="2931" stroke="#d5dfeb"/><text x="25" y="2953" class="foot">2026-10-14 / main・公開PR・設計案を分離</text><text x="25" y="2974" class="foot">DEVELOPMENT §2 / LESSONS</text><text x="25" y="2994" class="foot">#220・#222・#223 / PR #216・#225</text></svg>
