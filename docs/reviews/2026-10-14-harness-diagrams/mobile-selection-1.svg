<text x="32" y="299" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">人気2頁＋8タグ各2頁を列挙</text>
<text x="32" y="322" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">最大500候補から最大5対象を選ぶ</text>
<text x="32" y="345" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">順位はinstall数と更新の新しさ</text>
