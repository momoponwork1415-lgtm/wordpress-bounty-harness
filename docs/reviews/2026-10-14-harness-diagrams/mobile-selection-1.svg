<text x="32" y="505" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">測</text>
<text x="32" y="528" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">鮮度・版・除外作者を確認</text>
<text x="32" y="551" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">unavailable／staleはeligibl</text>
<text x="32" y="574" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">eにしない</text>
<text x="32" y="597" font-family="system-ui,sans-serif" font-size="15.5" fill="#334155">公開脆弱性履歴で個別順位付けしない</text>
