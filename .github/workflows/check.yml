name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  adr-guard:
    # docs/adr/ と docs/SPEC.md、および agent に渡る文章（prompt、skill、出力契約、victim 契約）を変える PR は
    # 所有者の owner-approved ラベルが要る（docs/DEVELOPMENT.md 第 5 節・第 6 節）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require owner-approved label for ADR and agent-facing text changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          has_label() { printf '%s' "$LABELS" | tr ',' '\n' | grep -qx 'owner-approved'; }
          adr=$(git diff --name-only "$BASE" "$HEAD" -- docs/adr/ docs/SPEC.md | wc -l)
          text=$(git diff --name-only "$BASE" "$HEAD" -- \
            src/profiles/wordpress/prompts/ \
            .claude/skills/ \
            src/profiles/wordpress/discovery/output-contract.ts \
            src/profiles/wordpress/verification/codex-verifier.ts \
            src/profiles/wordpress/policy/campaign.json | wc -l)
          if [ "$adr" -gt 0 ] && ! has_label; then
            echo "docs/adr/ または docs/SPEC.md に差分があります。所有者が owner-approved ラベルを付けるまで merge できません。"
            exit 1
          fi
          if [ "$text" -gt 0 ] && ! has_label; then
            echo "agent に渡る文章（prompt、skill、出力契約、victim 契約、Programme Boundary）に差分があります。所有者が全文を読んで owner-approved ラベルを付けるまで merge できません。"
            exit 1
          fi
          echo "adr-guard: ok"
